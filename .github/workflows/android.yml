name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's ubuntu runners ship the Android SDK preinstalled. We only need
      # to point Gradle at it, accept the SDK licences and ensure the platform
      # and build-tools this project targets are present.
      # (We deliberately do NOT use android-actions/setup-android here: its
      # default package list still requests the retired "tools" package, which
      # now fails with "Failed to find package 'tools'".)
      - name: Configure Android SDK
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

          echo "Installed platforms:"; ls "$ANDROID_HOME/platforms" || true
          echo "Installed build-tools:"; ls "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Provide MediaPipe model asset
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          MODEL_URL="https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
          EXPECTED_SHA256="fbc2a30080c3c557093b5ddfc334698132eb341044ccee322ccf8bcf3607cde1"
          echo "Downloading hand_landmarker.task ..."
          curl -fsSL -o app/src/main/assets/hand_landmarker.task "$MODEL_URL"
          ACTUAL_SHA256="$(sha256sum app/src/main/assets/hand_landmarker.task | awk '{print $1}')"
          echo "Expected: $EXPECTED_SHA256"
          echo "Actual  : $ACTUAL_SHA256"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::MediaPipe model checksum mismatch — refusing to build."
            exit 1
          fi
          ls -l app/src/main/assets/hand_landmarker.task

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AirTouch-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
